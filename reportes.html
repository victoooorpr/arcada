<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADA ROOFING — Reportes Fotográficos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0e1216;
    --panel:#161b21;
    --panel2:#1d232b;
    --line:#2a323b;
    --text:#eef1f4;
    --muted:#8b96a3;
    --red:#c1442d;
    --red-dim:#7a2c1c;
    --blue:#3f7ea6;
    --amber:#c98a2c;
    --green:#4a8b5c;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.4;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* Top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--panel);border-bottom:2px solid var(--red);position:sticky;top:0;z-index:50;}
  .topbar a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;}
  .topbar a:hover{color:var(--text);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:15px;color:#fff;}
  .brand-title{font-size:15px;font-weight:600;}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;}

  .wrap{max-width:960px;margin:0 auto;padding:22px 18px 80px;}

  /* Project panel */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel-title{font-size:12px;color:var(--muted);letter-spacing:.12em;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .panel-title::before{content:'';width:3px;height:14px;background:var(--red);display:inline-block;}
  summary.panel-title{cursor:pointer;user-select:none;list-style:none;}
  summary.panel-title::-webkit-details-marker{display:none;}
  summary.panel-title::marker{content:'';}
  summary.panel-title::after{content:'▸';margin-left:auto;color:var(--text);font-size:13px;}
  details[open] summary.panel-title::after{content:'▾';}
  details[open] summary.panel-title{margin-bottom:14px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase;}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:4px;font-size:14px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  .field{margin-bottom:12px;}

  .project-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .project-row select{flex:1;min-width:160px;}

  button{cursor:pointer;font-family:'Inter';font-weight:600;font-size:13px;border:none;border-radius:4px;padding:10px 16px;transition:.15s;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:#a3391f;}
  .btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--blue);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red-dim);padding:6px 10px;font-size:11px;}
  .btn-sm{padding:6px 10px;font-size:11px;}

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{padding:11px 16px;font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase;font-family:'Oswald';}
  .tab.active{color:var(--text);border-color:var(--red);}
  .tab .count{background:var(--panel2);border-radius:10px;padding:1px 7px;font-size:10px;margin-left:6px;font-family:'Inter';}

  /* Upload zone */
  .dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:16px;}
  .dropzone:hover{border-color:var(--blue);color:var(--text);}
  .dropzone.drag{border-color:var(--red);background:rgba(193,68,45,.06);}
  .dropzone input{display:none;}

  /* Photo grid */
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .photo-card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .photo-card img{width:100%;height:150px;object-fit:cover;display:block;background:#000;}
  .photo-card-body{padding:10px;}
  .photo-card select{margin-bottom:8px;font-size:12px;padding:7px 8px;}
  .photo-card textarea{font-size:12px;min-height:44px;resize:vertical;margin-bottom:8px;}
  .photo-card-footer{display:flex;align-items:center;justify-content:space-between;}
  .chk-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;margin:0;}
  .chk-label input{width:auto;}

  .empty-state{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}

  .actions-row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}

  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;}
  .badge-initial{background:rgba(63,126,166,.18);color:#7db6d9;}
  .badge-during{background:rgba(201,138,44,.18);color:#e0ab52;}
  .badge-completed{background:rgba(74,139,92,.18);color:#7fca93;}

  .toast-item{background:var(--panel2);color:var(--text);padding:12px 20px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;display:flex;align-items:center;gap:10px;}

  .final-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  @media(max-width:640px){.final-summary{grid-template-columns:1fr;}}
  .final-stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;}
  .final-stat .num{font-family:'Oswald';font-size:26px;font-weight:600;}
  .final-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
</style>
</head>

<div class="wrap">

  <!-- PROYECTO -->
  <details class="panel" open>
    <summary class="panel-title">Proyecto</summary>

    <div id="currentProjectBanner" style="font-size:13px;color:var(--text);margin-bottom:12px;padding:9px 10px;background:var(--panel2);border-radius:4px;border:1px solid var(--line);">Ningún proyecto seleccionado — busca un cliente abajo.</div>

    <div class="field" style="position:relative">
      <label>Buscar cliente en Notion (Arcada LEADS)</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="arcadaLeadSearch" placeholder="Nombre, dirección o teléfono..." oninput="arcadaDebounceSearch()" onkeydown="if(event.key==='Enter'){event.preventDefault();arcadaSearchLeads();}">
        <button class="btn-ghost btn-sm" onclick="arcadaSearchLeads()">Buscar</button>
      </div>
      <div id="arcadaLeadResults" style="display:none;position:absolute;z-index:30;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:4px;margin-top:4px;max-height:220px;overflow-y:auto;"></div>
      <div id="arcadaLeadStatus" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
    </div>

    <div id="newLeadBox" style="display:none;border:1px dashed var(--line);border-radius:4px;padding:12px;margin-top:6px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">No se encontró en Notion. Si es un cliente nuevo (ej. un vecino en campo), agrégalo aquí:</div>
      <div class="grid2">
        <div class="field"><label>Nombre</label><input type="text" id="newLeadName"></div>
        <div class="field"><label>Teléfono</label><input type="text" id="newLeadPhone"></div>
      </div>
      <div class="field"><label>Dirección</label><input type="text" id="newLeadAddress"></div>
      <button class="btn-primary btn-sm" onclick="createLeadAndProject()">Crear cliente en Notion</button>
    </div>

    <div class="grid2" style="margin-top:14px">
      <div class="field"><label>Dirección</label><input type="text" id="pAddress" oninput="saveMeta()"></div>
      <div class="field"><label>Cliente</label><input type="text" id="pClient" oninput="saveMeta()"></div>
      <div class="field">
        <label>Técnico / Inspector</label>
        <input type="text" id="pTech" list="techList" oninput="saveMeta()">
        <datalist id="techList"></datalist>
      </div>
      <div class="field"><label>Fecha</label><input type="date" id="pDate" oninput="saveMeta()"></div>
    </div>
  </details>

  <!-- DETALLES TECNICOS -->
  <details class="panel">
    <summary class="panel-title">Detalles del proyecto</summary>

    <div class="field">
      <label>Cliente orientado a</label>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:2px">
        <label class="chk-label"><input type="checkbox" id="oInsurance" onchange="saveOrientation()"> Insurance</label>
        <label class="chk-label"><input type="checkbox" id="oRetail" onchange="saveOrientation()"> Retail</label>
        <label class="chk-label"><input type="checkbox" id="oFinance" onchange="saveOrientation()"> Finance</label>
        <label class="chk-label"><input type="checkbox" id="oAppraisal" onchange="saveOrientation()"> Appraisal</label>
      </div>
    </div>

    <div class="field">
      <label>Tipo de techo</label>
      <select id="pRoofType" onchange="saveRoofType()">
        <option value="">-- Selecciona --</option>
        <option>Shingles - 30 años</option>
        <option>Shingles - T-Lock</option>
        <option>Shingles - 3-Tab</option>
        <option>Modified Bitumen</option>
        <option>TPO</option>
        <option>Tile</option>
      </select>
    </div>

    <label style="margin-bottom:8px">Medidas de superficie</label>
    <div class="grid2">
      <div class="field"><label>Shingles (ft)</label><input type="text" id="m_shinglesArea" oninput="saveMeasurements()"></div>
      <div class="field"><label>Flat (ft)</label><input type="text" id="m_flatArea" oninput="saveMeasurements()"></div>
      <div class="field"><label>Ridge (lf)</label><input type="text" id="m_ridgeLf" oninput="saveMeasurements()"></div>
      <div class="field"><label>Eave (lf)</label><input type="text" id="m_eaveLf" oninput="saveMeasurements()"></div>
      <div class="field"><label>Drip Edge (lf)</label><input type="text" id="m_dripedgeLf" oninput="saveMeasurements()"></div>
      <div class="field"><label>Valleys (lf)</label><input type="text" id="m_valleysLf" oninput="saveMeasurements()"></div>
      <div class="field"><label>Ridge Vents actuales</label><input type="text" id="m_ridgeVentsCurrent" oninput="saveMeasurements()"></div>
      <div class="field"><label>Ridge Vents necesarios</label><input type="text" id="m_ridgeVentsNeeded" oninput="saveMeasurements()"></div>
      <div class="field"><label>Counter Flashing (lf)</label><input type="text" id="m_counterFlashingLf" oninput="saveMeasurements()"></div>
      <div class="field"><label>L Flashing (lf)</label><input type="text" id="m_lFlashingLf" oninput="saveMeasurements()"></div>
      <div class="field"><label>Plywood (hojas)</label><input type="text" id="m_plywoodSheets" oninput="saveMeasurements()"></div>
    </div>

    <label style="margin-bottom:8px;display:block;margin-top:14px">Accesorios (inspección manual)</label>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px">
      <div class="field"><label>Pitch Pan</label><input type="number" min="0" id="acc_pitchPan" oninput="saveAccessories()"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px">
      <div class="field"><label>Gooseneck 4"</label><input type="number" min="0" id="acc_gooseneck4" oninput="saveAccessories()"></div>
      <div class="field"><label>Gooseneck 6"</label><input type="number" min="0" id="acc_gooseneck6" oninput="saveAccessories()"></div>
      <div class="field"><label>Gooseneck 8"</label><input type="number" min="0" id="acc_gooseneck8" oninput="saveAccessories()"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px">
      <div class="field"><label>Multifit 1-3"</label><input type="number" min="0" id="acc_multifit1_3" oninput="saveAccessories()"></div>
      <div class="field"><label>Multifit 3-4"</label><input type="number" min="0" id="acc_multifit3_4" oninput="saveAccessories()"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px">
      <div class="field"><label>Hot Kit 3"</label><input type="number" min="0" id="acc_hotKit3" oninput="saveAccessories()"></div>
      <div class="field"><label>Hot Kit 4"</label><input type="number" min="0" id="acc_hotKit4" oninput="saveAccessories()"></div>
      <div class="field"><label>Hot Kit 5"</label><input type="number" min="0" id="acc_hotKit5" oninput="saveAccessories()"></div>
      <div class="field"><label>Hot Kit 6"</label><input type="number" min="0" id="acc_hotKit6" oninput="saveAccessories()"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div class="field"><label>Skylight</label><input type="number" min="0" id="acc_skylight" oninput="saveAccessories()"></div>
      <div class="field"><label>Termination Bars</label><input type="number" min="0" id="acc_terminationBars" oninput="saveAccessories()"></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label>Otro (especifica)</label><input type="text" id="acc_otroDesc" placeholder="ej. Boot 2&quot;" oninput="saveAccessories()"></div>
      <div class="field"><label>Cantidad</label><input type="number" min="0" id="acc_otroQty" oninput="saveAccessories()"></div>
    </div>

    <label class="chk-label" style="margin-top:14px"><input type="checkbox" id="m_redeck" onchange="saveMeasurements()"> Necesita redeck</label>
  </details>

  <!-- FOTOS (fija, no colapsable) -->
  <div class="panel">
    <p class="panel-title">Fotos</p>
    <div class="tabs" id="tabsBar"></div>

    <div id="phaseView"></div>

    <div id="finalView" style="display:none"></div>
  </div>

</div>

/* ---------- ALMACENAMIENTO (IndexedDB) ----------
   Antes todos los proyectos se guardaban como un solo JSON en localStorage,
   que en la mayoría de navegadores tiene un límite de 5-10MB total — apenas
   alcanzaba para unas cuantas fotos. Ahora cada proyecto es un registro
   independiente en IndexedDB (cuota típica de cientos de MB), lo que permite
   guardar de forma confiable 50-100+ fotos por inspección. */
const IDB_NAME = 'arcada_reportes_db';
const IDB_STORE = 'projects';
let _idbPromise = null;
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error((label||'Operación') + ' tardó demasiado (' + ms + 'ms) — probablemente el navegador está bloqueando el almacenamiento en este iframe.')), ms))
  ]);
}
function openIDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(typeof indexedDB === 'undefined' || !indexedDB){
      reject(new Error('IndexedDB no está disponible en este navegador/contexto'));
      return;
    }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'id'});
    };
    req.onsuccess = e=> resolve(e.target.result);
    req.onerror = e=> reject(e.target.error);
    req.onblocked = ()=> reject(new Error('IndexedDB bloqueado por otra pestaña abierta con esta misma app'));
  });
  return _idbPromise;
}
async function idbGetAllProjects(){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=>{
      const map = {};
      req.result.forEach(rec=>{ map[rec.id] = rec.data; });
      resolve(map);
    };
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPutProject(id, data){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({id, data});
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbDeleteProject(id){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function loadStore(){
  try{
    state.projects = await withTimeout(idbGetAllProjects(), 3000, 'Cargar proyectos guardados');
    // migración única desde la versión anterior basada en localStorage
    const oldRaw = localStorage.getItem('arcada_reportes_v1');
    if(oldRaw && Object.keys(state.projects).length===0){
      const old = JSON.parse(oldRaw);
      for(const id in old){ await idbPutProject(id, old[id]); }
      state.projects = old;
      localStorage.removeItem('arcada_reportes_v1');
    }
  }catch(e){
    console.error('load error', e);
    state.projects = state.projects || {};
    showToast('⚠️ No se pudo acceder al almacenamiento local en este navegador — las fotos no se guardarán entre sesiones');
  }
}
function saveStore(){
  const p = state.projects[state.currentId];
  if(!state.currentId || !p) return;
  withTimeout(idbPutProject(state.currentId, p), 5000, 'Guardar proyecto').catch(e=>{
    showToast('⚠️ Error guardando (revisa espacio disponible en el dispositivo)');
    console.error(e);
  });
}

function emptyAccessories(){
  const obj = {};
  ACCESSORY_FIELDS.forEach(f=>{ obj[f.key] = 0; });
  obj.otroDesc = '';
  obj.otroQty = 0;
  return obj;
}
function fillAccessories(){
  const p = state.projects[state.currentId];
  if(!p || !p.measurements) return;
  if(!p.measurements.accessories) p.measurements.accessories = emptyAccessories();
  const acc = p.measurements.accessories;
  ACCESSORY_FIELDS.forEach(f=>{
    const el = document.getElementById('acc_'+f.key);
    if(el) el.value = acc[f.key] || 0;
  });
  const otroDescEl = document.getElementById('acc_otroDesc');
  const otroQtyEl = document.getElementById('acc_otroQty');
  if(otroDescEl) otroDescEl.value = acc.otroDesc || '';
  if(otroQtyEl) otroQtyEl.value = acc.otroQty || 0;
}
function saveAccessories(){
  const p = state.projects[state.currentId];
  if(!p) return;
  if(!p.measurements) p.measurements = emptyMeasurements();
  if(!p.measurements.accessories) p.measurements.accessories = emptyAccessories();
  const acc = p.measurements.accessories;
  ACCESSORY_FIELDS.forEach(f=>{
    const el = document.getElementById('acc_'+f.key);
    if(el) acc[f.key] = parseInt(el.value, 10) || 0;
  });
  const otroDescEl = document.getElementById('acc_otroDesc');
  const otroQtyEl = document.getElementById('acc_otroQty');
  if(otroDescEl) acc.otroDesc = otroDescEl.value;
  if(otroQtyEl) acc.otroQty = parseInt(otroQtyEl.value, 10) || 0;
  saveStore();
}
function emptyPhaseComments(){
  return { initial:{internal:'',external:''}, during:{internal:'',external:''}, completed:{internal:'',external:''} };
}
function showToast(msg){
  const container = document.getElementById('toastContainer');
  const isProblem = msg.indexOf('⚠️') !== -1 || msg.indexOf('❌') !== -1;
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.style.border = '1px solid ' + (isProblem ? 'var(--red)' : 'var(--green)');
  const textSpan = document.createElement('span');
  textSpan.textContent = msg;
  el.appendChild(textSpan);
  if(isProblem){
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = '✕';
    closeBtn.style.cssText = 'background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;flex-shrink:0;';
    closeBtn.onclick = ()=> el.remove();
    el.appendChild(closeBtn);
  }
  container.appendChild(el);
  const duration = isProblem ? 15000 : 2600; // los errores se quedan más tiempo para poder leerlos/copiarlos
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, duration);
}

/* ---------- BUSQUEDA / CREACION DE CLIENTES EN NOTION ----------
   Mismo patron (mismos ids de función/variables) que el widget de búsqueda
   ya probado en la herramienta de Estimados, para evitar cualquier diferencia
   sutil entre ambos. */
(function(){
  var arcadaLeadTimer = null;
  window.arcadaDebounceSearch = function(){
    clearTimeout(arcadaLeadTimer);
    arcadaLeadTimer = setTimeout(window.arcadaSearchLeads, 500);
  };
  window.arcadaSearchLeads = async function(){
    var input = document.getElementById('arcadaLeadSearch');
    var q = input.value.trim();
    var box = document.getElementById('arcadaLeadResults');
    var status = document.getElementById('arcadaLeadStatus');
    var newLeadBox = document.getElementById('newLeadBox');
    newLeadBox.style.display = 'none';
    if(q.length < 2){ box.style.display = 'none'; return; }
    status.textContent = 'Buscando...';
    try{
      var res = await fetch(NOTION_SEARCH_ENDPOINT + '?q=' + encodeURIComponent(q));
      if(!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      window.arcadaRenderLeadResults(data.results || []);
      if((data.results||[]).length){
        status.textContent = '';
      }else{
        status.textContent = 'Sin resultados en Notion.';
        document.getElementById('newLeadAddress').value = q;
        newLeadBox.style.display = 'block';
      }
    }catch(e){
      console.error('arcadaSearchLeads error', e);
      status.textContent = '⚠️ No se pudo conectar con Notion.';
      showToast('⚠️ Error buscando en Notion — revisa la consola del navegador (F12)');
      box.style.display = 'none';
    }
  };
  window.arcadaRenderLeadResults = function(items){
    var box = document.getElementById('arcadaLeadResults');
    if(items.length === 0){ box.style.display = 'none'; return; }
    box.innerHTML = items.map(function(it, i){
      return '<div style="padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer" onclick="arcadaApplyLead(' + i + ')">'
        + '<div style="font-weight:600">' + (it.address || '(sin dirección)') + '</div>'
        + '<div style="color:var(--muted);font-size:11px">' + (it.client || '') + (it.phone ? ' · ' + it.phone : '') + (it.status ? ' · ' + it.status : '') + '</div>'
        + '</div>';
    }).join('');
    box.style.display = 'block';
    window._arcadaLeadResultsCache = items;
  };
  document.addEventListener('click', function(e){
    var box = document.getElementById('arcadaLeadResults');
    var input = document.getElementById('arcadaLeadSearch');
    if(box && input && !box.contains(e.target) && e.target !== input) box.style.display = 'none';
  });
  window.arcadaApplyLead = function(i){
    var it = window._arcadaLeadResultsCache[i];
    document.getElementById('arcadaLeadResults').style.display = 'none';
    document.getElementById('arcadaLeadSearch').value = it.address || it.client || '';
    linkOrCreateLocalProject(it.id, it.address || '', it.client || '', it.phone || '', it.status || '');
    showToast('✅ Proyecto vinculado');
  };
})();

async function createLeadAndProject(){
  const name = document.getElementById('newLeadName').value.trim();
  const phone = document.getElementById('newLeadPhone').value.trim();
  const address = document.getElementById('newLeadAddress').value.trim();
  if(!name || !address){ showToast('⚠️ Falta nombre o dirección'); return; }
  try{
    const res = await fetch(NOTION_CREATE_LEAD_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ address, client: name, phone })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(JSON.stringify(data.error||data));
    linkOrCreateLocalProject(data.id, address, name, phone, data.status || 'Arcada Inspection');
    document.getElementById('newLeadBox').style.display = 'none';
    document.getElementById('newLeadName').value = '';
    document.getElementById('newLeadPhone').value = '';
    document.getElementById('arcadaLeadStatus').textContent = '';
    showToast('✅ Cliente creado en Notion y proyecto vinculado');
  }catch(e){
    console.error(e);
    showToast('⚠️ No se pudo crear el cliente en Notion');
  }
}

function statusToLadderIndex(statusText){
  const idx = STATUS_LADDER.indexOf(statusText);
  return idx === -1 ? 0 : idx;
}

function linkOrCreateLocalProject(notionPageId, address, client, phone, notionStatus){
  // Si ya existe un proyecto local ligado a esta misma página de Notion, lo reutilizamos
  // (esto es lo que hace que el inspector pueda volver días después a seguir subiendo fotos).
  const existingId = Object.keys(state.projects).find(id => state.projects[id].notionPageId === notionPageId);
  if(existingId){
    state.currentId = existingId;
  }else{
    const id = uid();
    state.projects[id] = {
      address, client, phone, tech:'', date: new Date().toISOString().slice(0,10),
      notionPageId,
      statusStep: statusToLadderIndex(notionStatus),
      orientation:{insurance:false, retail:false, finance:false, appraisal:false}, roofType:'',
      measurements: emptyMeasurements(),
      phaseComments: emptyPhaseComments(),
      commentSynced: { initial:'', during:'', completed:'' },
      measurementsSynced: null,
      measurementsPageId: null,
      phases:{initial:[],during:[],completed:[]}
    };
    state.currentId = id;
    saveStore();
  }
  try{ localStorage.setItem('arcada_reportes_last_id', state.currentId); }catch(e){ console.error('localStorage error', e); }
  fillMetaFields();
  renderProjectBanner();
  renderTabs(); renderPhase();
}

function renderProjectBanner(){
  const banner = document.getElementById('currentProjectBanner');
  const p = state.projects[state.currentId];
  if(!p){ banner.textContent = 'Ningún proyecto seleccionado — busca un cliente arriba.'; return; }
  banner.innerHTML = `Trabajando en: <strong>${p.address || 'Sin dirección'}</strong>${p.client ? ' — ' + p.client : ''}`;
}

function fillMetaFields(){
  const p = state.projects[state.currentId];
  if(!p) return;
  document.getElementById('pAddress').value = p.address || '';
  document.getElementById('pClient').value = p.client || '';
  document.getElementById('pTech').value = p.tech || '';
  document.getElementById('pDate').value = p.date || '';
  if(!p.orientation) p.orientation = {insurance:false, retail:false, finance:false, appraisal:false};
  if(!p.measurements) p.measurements = emptyMeasurements();
  if(!p.phaseComments) p.phaseComments = emptyPhaseComments();
  if(!p.commentSynced) p.commentSynced = { initial:'', during:'', completed:'' };
  if(typeof p.statusStep !== 'number') p.statusStep = 0;

/* ---------- SINCRONIZACION CON NOTION (status + comentario interno) ---------- */
async function maybeAdvanceStatus(p, phaseKey){
  if(!p.notionPageId) return;
  const targetStep = STATUS_STEP_FOR_PHASE[phaseKey];
  if(targetStep === undefined) return;
  if(typeof p.statusStep !== 'number') p.statusStep = 0;
  if(targetStep <= p.statusStep) return; // ya está igual o más avanzado — nunca retrocedemos
  const newStatus = STATUS_LADDER[targetStep];
  try{
    const res = await fetch(NOTION_UPDATE_STATUS_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ pageId: p.notionPageId, status: newStatus })
    });
    if(res.ok){
      p.statusStep = targetStep;
      saveStore();
      showToast('✅ Status en Notion actualizado a "' + newStatus + '"');
    }else{
      const errData = await res.json().catch(()=>({}));
      console.error('status update rejected by Notion', errData);
      showToast('⚠️ Notion rechazó el cambio de status a "' + newStatus + '" — revisa que esa opción exista en tu campo Fase');
    }
  }catch(e){
    console.error('status sync error', e);
    showToast('⚠️ Error de conexión actualizando el status en Notion');
  }
}
async function maybeSyncInternalComment(p, phaseKey){
  if(!p.notionPageId) return;
  const comments = p.phaseComments && p.phaseComments[phaseKey];
  const text = comments ? (comments.internal || '').trim() : '';
  if(!text) return;
  if(!p.commentSynced) p.commentSynced = { initial:'', during:'', completed:'' };
  if(text === p.commentSynced[phaseKey]) return; // ya se mandó este mismo texto
  const phaseInfo = PHASES.find(x=>x.key===phaseKey);
  const dateStr = new Date().toLocaleDateString('en-US');
  const formatted = `[${phaseInfo.shortEn} — ${dateStr}] ${text}`;
  try{
    const res = await fetch(NOTION_ADD_COMMENT_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ pageId: p.notionPageId, text: formatted })
    });
    if(res.ok){
      p.commentSynced[phaseKey] = text;
      saveStore();
    }
  }catch(e){ console.error('comment sync error', e); }
}
async function syncMeasurementsToNotion(p){
  try{
    if(!p.notionPageId){ console.log('syncMeasurementsToNotion: sin notionPageId, se cancela'); return; }
    const rows = buildMeasurementRows(p);
    console.log('syncMeasurementsToNotion: rows a mandar =', rows);
    if(rows.length === 0){ console.log('syncMeasurementsToNotion: no hay medidas que mandar'); return; }
    const snapshot = JSON.stringify(rows);
    if(p.measurementsSynced === snapshot && p.measurementsPageId){
      console.log('syncMeasurementsToNotion: ya estaba sincronizado, se salta');
      return;
    }
    const dateStr = new Date().toLocaleDateString('en-US');
    showToast('📤 Guardando medidas en Notion...');
    const res = await fetch(NOTION_MEASUREMENTS_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        parentPageId: p.notionPageId,
        existingPageId: p.measurementsPageId || null,
        title: 'Measurements',
        entryTitle: `Before — ${dateStr}`,
        rows,
        jsonData: p.measurements
      })
    });
    const data = await res.json();
    if(res.ok){
      p.measurementsSynced = snapshot;
      if(data.pageId) p.measurementsPageId = data.pageId;
      saveStore();
      showToast('✅ Medidas guardadas en la subpágina "Measurements"');
    }else{
      console.error('measurements sync rejected', data);
      const stepInfo = data && data.step ? ('[' + data.step + '] ') : '';
      const msg = (data && data.error && (data.error.message || JSON.stringify(data.error))) || 'Error';
      showToast('⚠️ No se pudieron guardar las medidas en Notion: ' + stepInfo + msg);
    }
  }catch(e){
    console.error('measurements sync error', e);
    showToast('⚠️ Error de conexión guardando medidas en Notion');
  }
}
function saveComment(phaseKey, kind, value){
  const p = state.projects[state.currentId];
  if(!p) return;
  if(!p.phaseComments) p.phaseComments = emptyPhaseComments();
  p.phaseComments[phaseKey][kind] = value;
  saveStore();
}

function renderTabs(){
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = '';
  const p = state.projects[state.currentId];
  PHASES.forEach(ph=>{
    const div = document.createElement('div');
    div.className = 'tab' + (state.activeTab===ph.key && document.getElementById('finalView').style.display==='none' ? ' active':'');
    const n = p ? p.phases[ph.key].length : 0;
    div.innerHTML = ph.label + `<span class="count">${n}</span>`;
    div.onclick = ()=>{ state.activeTab = ph.key; document.getElementById('finalView').style.display='none'; document.getElementById('phaseView').style.display='block'; renderTabs(); renderPhase(); };
    bar.appendChild(div);
  });
  const finalTab = document.createElement('div');
  finalTab.className = 'tab' + (document.getElementById('finalView').style.display==='block' ? ' active':'');
  finalTab.textContent = 'Reporte Final Cliente';
  finalTab.onclick = ()=>{ document.getElementById('phaseView').style.display='none'; document.getElementById('finalView').style.display='block'; renderTabs(); renderFinal(); };
  bar.appendChild(finalTab);
}

  let html = `

function togglePhotoComment(phaseKey, idx, checked){
  const p = state.projects[state.currentId];
  if(!p) return;
  p.phases[phaseKey][idx].hasComment = checked;

  renderPhase();
}

function handleFiles(fileList){
  const key = state.activeTab;
  const p = state.projects[state.currentId];
  if(!p) return;
  const incoming = [...fileList].filter(f=>f.type.startsWith('image/'));
  const totalAfter = p.phases[key].length + incoming.length;
  if(totalAfter > 100){
    showToast('⚠️ Esta etapa llegará a ' + totalAfter + ' fotos (recomendado: hasta 100)');
  }
  incoming.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      compressImage(e.target.result, 1100, 0.6).then(compressed=>{
        p.phases[key].push({ id: uid(), dataUrl: compressed, category: CATEGORIES[0], note:'', includeInFinal:true, ts: Date.now() });
        saveStore();
        renderTabs(); renderPhase();
      });
    };
    reader.readAsDataURL(file);
  });
}

function compressImage(dataUrl, maxW, quality){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

function updatePhoto(phaseKey, idx, field, value){
  const p = state.projects[state.currentId];

function removePhoto(phaseKey, idx){

function pdfHeader(doc, p, title, pageW){
  doc.setFillColor(193,68,45);
  doc.rect(0,0,pageW,26,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);

  doc.setFont('helvetica','normal');
  doc.text(title, 14, 20);
  doc.setTextColor(20,20,20);
}

function orientationLabel(p){
  if(!p.orientation) return '—';
  const labels = [];
  if(p.orientation.insurance) labels.push('Insurance');
  if(p.orientation.retail) labels.push('Retail');
  if(p.orientation.finance) labels.push('Finance');
  if(p.orientation.appraisal) labels.push('Appraisal');
  return labels.length ? labels.join(' + ') : '—';
}
function pdfProjectBlock(doc, p, y){
  doc.setFontSize(10);
  doc.setFont('helvetica','bold');
  doc.text('Address:', 14, y); doc.setFont('helvetica','normal'); doc.text(p.address || '—', 42, y);
  doc.setFont('helvetica','bold');
  doc.text('Client:', 105, y); doc.setFont('helvetica','normal'); doc.text(p.client || '—', 125, y);
  y += 6;
  doc.setFont('helvetica','bold');
  doc.text('Inspector:', 14, y); doc.setFont('helvetica','normal'); doc.text(p.tech || '—', 42, y);
  doc.setFont('helvetica','bold');
  doc.text('Date:', 105, y); doc.setFont('helvetica','normal'); doc.text(p.date || '—', 125, y);
  y += 6;
  doc.setFont('helvetica','bold');
  doc.text('Roof Type:', 14, y); doc.setFont('helvetica','normal'); doc.text(p.roofType || '—', 42, y);
  doc.setFont('helvetica','bold');
  doc.text('For:', 105, y); doc.setFont('helvetica','normal'); doc.text(orientationLabel(p), 125, y);
  return y + 8;
}

function accessoryPdfRows(m){
  const acc = (m && m.accessories) || {};
  const rows = [];
  ACCESSORY_FIELDS.forEach(f=>{
    const v = acc[f.key];
    if(v){ rows.push([f.label, v]); }
  });
  if(acc.otroDesc && acc.otroQty){ rows.push([acc.otroDesc, acc.otroQty]); }
  return rows;
}
function buildMeasurementRows(p){
  const m = p.measurements || {};
  const rows = [
    ['Shingles area (ft)', m.shinglesArea], ['Flat area (ft)', m.flatArea],
    ['Ridge (lf)', m.ridgeLf], ['Eave (lf)', m.eaveLf],
    ['Drip edge (lf)', m.dripedgeLf], ['Valleys (lf)', m.valleysLf],
    ['Ridge vents (current)', m.ridgeVentsCurrent], ['Ridge vents (needed)', m.ridgeVentsNeeded],
    ['Counter flashing (lf)', m.counterFlashingLf], ['L flashing (lf)', m.lFlashingLf],
    ['Plywood sheets', m.plywoodSheets], ['Redeck needed', m.redeck ? 'Yes' : 'No'],
    ...accessoryPdfRows(m)
  ].filter(r=> r[1] !== undefined && r[1] !== '' && r[1] !== false);
  return rows;
}

function addPhotoGrid(doc, photos, startY, pageW, pageH, showNotes){
  const marginX = 14, gap = 6;
  const colW = (pageW - marginX*2 - gap) / 2;
  const imgH = colW * 0.68;
  let x = marginX, y = startY, col = 0;

  let rowMaxH = 0;
  photos.forEach(ph=>{
    const hasNote = showNotes && ph.hasComment && ph.note && ph.note.trim().length > 0;
    const noteLines = hasNote ? doc.splitTextToSize(ph.note, colW) : [];
    const noteH = hasNote ? noteLines.length * 3.6 + 6 : 0;
    const blockH = imgH + 4 + noteH;
    if(col === 0 && y + blockH > pageH - 14){
      doc.addPage();
      y = 18; col = 0; x = marginX; rowMaxH = 0;
    }
    try{ doc.addImage(ph.dataUrl, 'JPEG', x, y, colW, imgH); }catch(e){}
    doc.setDrawColor(220,220,220);
    doc.rect(x, y, colW, imgH);
    if(hasNote){
      doc.setFontSize(8.5);
      doc.setFont('helvetica','normal');
      doc.text(noteLines, x, y + imgH + 6);
    }
    rowMaxH = Math.max(rowMaxH, blockH);
    if(col === 0){ col = 1; x = marginX + colW + gap; }
    else{ col = 0; x = marginX; y += rowMaxH + 4; rowMaxH = 0; }
  });
}

/* ---------- GUARDAR / DESCARGAR PDF (compatible con móvil) ---------- */
function isMobileDevice(){
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}
function showManualLink(url, fname){
  let box = document.getElementById('manualPdfLink');
  if(!box){
    box = document.createElement('div');
    box.id = 'manualPdfLink';
    box.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--red);border-radius:8px;padding:12px 18px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.5);';
    document.body.appendChild(box);
  }
  box.innerHTML = `<a href="${url}" download="${fname}" target="_blank" style="color:#fff;font-weight:600;font-size:13px;text-decoration:underline;">📄 Toca aquí para abrir/guardar el PDF</a>
    <button onclick="document.getElementById('manualPdfLink').remove()" style="margin-left:10px;background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;">✕</button>`;
}
function savePDF(doc, fname){
  try{
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    if(isMobileDevice()){
      // En móvil, doc.save() con frecuencia no dispara la descarga (especialmente dentro
      // de un iframe embebido). Abrimos el PDF en una pestaña nueva; el navegador
      // muestra el visor con opción de Compartir/Guardar. Si el popup se bloquea,
      // dejamos un enlace manual visible.
      const win = window.open(url, '_blank');
      if(!win || win.closed || typeof win.closed === 'undefined'){
        showManualLink(url, fname);
        showToast('⚠️ Toca el enlace para abrir el PDF');
      }else{
        showToast('✅ PDF listo — usa Compartir/Guardar en el visor');
      }
    }else{
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('✅ PDF descargado: ' + fname);
    }
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 120000);
  }catch(e){
    console.error('savePDF error', e);
    try{ doc.save(fname); }
    catch(e2){ showToast('❌ No se pudo generar el PDF'); }
  }
}

function addExternalCommentBlock(doc, text, y, pageW, pageH){
  if(!text) return y;
  const lines = doc.splitTextToSize(text, pageW - 28);
  const blockH = 6 + lines.length*4.2 + 6;
  if(y + blockH > pageH - 14){ doc.addPage(); y = 18; }
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('Notes', 14, y); y += 5;
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(lines, 14, y);
  return y + lines.length*4.2 + 8;
}

// Sube el reporte de una etapa a Notion. Si tiene demasiadas fotos para caber en
// una sola solicitud (límite práctico de Netlify Functions / Notion), lo divide en
// varios PDFs más chicos y los sube todos por separado a la misma página — así el
// reporte siempre llega a Notion sin importar cuántas fotos tenga.
async function attachPhaseReportToNotion(p, phaseKey, photos){
  if(!p.notionPageId || !window.arcadaAttachPdf) return;
  const phaseInfo = PHASES.find(x=>x.key===phaseKey);
  const BATCH_SIZE = 8; // fotos por PDF parcial — más chico para evitar el límite de 10s de las funciones de Netlify
  const totalParts = Math.max(1, Math.ceil(photos.length / BATCH_SIZE));
  if(totalParts > 1){
    showToast(`📤 Reporte con ${photos.length} fotos — subiendo a Notion en ${totalParts} partes...`);
  }
  for(let i=0;i<totalParts;i++){
    const batch = photos.slice(i*BATCH_SIZE, (i+1)*BATCH_SIZE);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','mm','a4');
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const partLabel = totalParts > 1 ? ` (Part ${i+1}/${totalParts})` : '';
    pdfHeader(doc, p, phaseInfo.labelEn + partLabel, pageW);
    let y = pdfProjectBlock(doc, p, 40);
    doc.setFontSize(9); doc.setTextColor(140,140,140);
    doc.text(`Photos ${i*BATCH_SIZE+1}-${i*BATCH_SIZE+batch.length} of ${photos.length}`, 14, y);
    doc.setTextColor(20,20,20);
    y += 8;
    addPhotoGrid(doc, batch, y, pageW, pageH, true);

    const base64 = doc.output('datauristring').split('base64,')[1];
    const fname = `Arcada_${(p.address||'project').replace(/[^a-z0-9]+/gi,'_')}_${phaseInfo.shortEn}${totalParts>1?'_part'+(i+1)+'of'+totalParts:''}_${(p.date||'')}.pdf`;
    try{
      await window.arcadaAttachPdf(p.notionPageId, base64, fname);
    }catch(e){ console.error('attach batch error', e); }
  }
}

function generatePhaseReport(phaseKey){
  const p = state.projects[state.currentId];
  const photos = p.phases[phaseKey];
  if(photos.length===0){ showToast('No hay fotos en esta etapa todavía'); return; }
  const phaseInfo = PHASES.find(x=>x.key===phaseKey);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','mm','a4');
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();

  pdfHeader(doc, p, phaseInfo.labelEn, pageW);
  let y = pdfProjectBlock(doc, p, 40);
  doc.setFontSize(9); doc.setTextColor(140,140,140);
  doc.text(`Total photos: ${photos.length}  ·  Generated: ${new Date().toLocaleDateString('en-US')}`, 14, y);
  doc.setTextColor(20,20,20);
  y += 8;

  addPhotoGrid(doc, photos, y, pageW, pageH, true);

  const fname = `Arcada_${(p.address||'project').replace(/[^a-z0-9]+/gi,'_')}_${phaseInfo.shortEn}_${(p.date||'')}.pdf`;
  savePDF(doc, fname);

  // Al generar el PDF es cuando avisamos a Notion: avanzamos el status (sin
  // retroceder nunca), mandamos el comentario interno, adjuntamos el PDF
  // (troceado en partes si hay muchas fotos), y guardamos las medidas por
  // separado (nunca en el PDF — son para la futura lista de materiales).
  attachPhaseReportToNotion(p, phaseKey, photos);
  maybeAdvanceStatus(p, phaseKey);
  maybeSyncInternalComment(p, phaseKey);
  if(phaseKey === 'initial'){ syncMeasurementsToNotion(p); }
}

function generateFinalReport(){
  const p = state.projects[state.currentId];
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','mm','a4');
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();

  // Cover page
  doc.setFillColor(14,18,22);
  doc.rect(0,0,pageW,pageH,'F');
  doc.setFillColor(193,68,45);
  doc.rect(0, pageH/2 - 30, pageW, 3, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(26);
  doc.text('PROJECT REPORT', pageW/2, pageH/2 - 12, {align:'center'});
  doc.setFontSize(13);
  doc.setFont('helvetica','normal');
  doc.text(p.address || 'Project', pageW/2, pageH/2 - 2, {align:'center'});
  doc.setFontSize(10);
  doc.setTextColor(200,200,200);
  doc.text(`Client: ${p.client || '—'}`, pageW/2, pageH/2 + 8, {align:'center'});
  doc.text(`Date: ${p.date || '—'}`, pageW/2, pageH/2 + 14, {align:'center'});
  doc.setFontSize(9);
  doc.setTextColor(150,150,150);
  doc.text('ARCADA INTEGRATED CONSTRUCTION GROUP  ·  Before · During · After', pageW/2, pageH - 18, {align:'center'});

  PHASES.forEach(ph=>{
    const photos = p.phases[ph.key].filter(x=>x.includeInFinal);
    if(photos.length===0) return;
    doc.addPage();
    pdfHeader(doc, p, p.address || 'Project report', pageW);

    // Banda divisoria de color por etapa — para que Antes/Durante/Después no se confundan al hojear el PDF
    doc.setFillColor(ph.rgb[0], ph.rgb[1], ph.rgb[2]);
    doc.rect(0, 26, pageW, 14, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(13);
    doc.text(ph.shortEn.toUpperCase() + '  —  ' + ph.labelEn, 14, 35.5);
    doc.setFontSize(9);
    doc.setFont('helvetica','normal');
    doc.text(photos.length + (photos.length===1?' photo':' photos'), pageW - 14, 35.5, {align:'right'});
    doc.setTextColor(20,20,20);

    let y = pdfProjectBlock(doc, p, 48);
    y += 6;
    const externalComment = ((p.phaseComments && p.phaseComments[ph.key] && p.phaseComments[ph.key].external) || '').trim();
    y = addExternalCommentBlock(doc, externalComment, y, pageW, pageH);
    addPhotoGrid(doc, photos, y, pageW, pageH, false);
  });

  doc.addPage();
  doc.setFontSize(11);
  doc.setFont('helvetica','italic');
  doc.setTextColor(90,90,90);
  doc.text('Thank you for trusting Arcada Roofing with your project.', 14, 30);
  doc.text('If you have any questions about this report, please contact us.', 14, 38);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text('asoto@arcadaroofing.com  ·  (602) 633-5075  ·  11691 N Luckenbach St, Surprise, AZ', 14, 48);

  const fname = `Arcada_${(p.address||'project').replace(/[^a-z0-9]+/gi,'_')}_Final_Report_${(p.date||'')}.pdf`;
  savePDF(doc, fname);
}

<script>
(function(){
  window.arcadaUint8ToBase64 = function(bytes){
    var binary = '';
    var chunkSize = 0x8000;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  };

  window.arcadaShowAttachStatus = function(msg){
    var el = document.getElementById('arcadaAttachToast');
    var isProblem = msg.indexOf('⚠️') !== -1 || msg.indexOf('❌') !== -1;
    if(!el){
      el = document.createElement('div');
      el.id = 'arcadaAttachToast';
      document.body.appendChild(el);
    }
    el.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1d232b;border:1px solid ' + (isProblem ? '#c1443a' : '#2a323b') + ';color:#eef1f4;padding:10px 18px;border-radius:6px;font-size:13px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw;';
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    var duration = isProblem ? 15000 : 4000;
    el._t = setTimeout(function(){ el.style.display='none'; }, duration);
  };

  window.arcadaAttachPdf = async function(pageId, base64, fileName){
    const MAX_ATTEMPTS = 3;
    for(let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
      window.arcadaShowAttachStatus(attempt===1 ? 'Subiendo PDF a Notion...' : `Reintentando subir PDF a Notion (intento ${attempt}/${MAX_ATTEMPTS})...`);
      try{
        var res = await fetch('/.netlify/functions/attach-pdf-to-notion', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ pageId: pageId, fileName: fileName, pdfBase64: base64 })
        });
        var data = await res.json();
        if(!res.ok){
          const stepInfo = data && data.step ? ('[' + data.step + '] ') : '[sin step] ';
          const code = data && data.error && data.error.code ? (' (code: ' + data.error.code + ')') : '';
          const msg = (data && data.error && (data.error.message || JSON.stringify(data.error))) || 'Error';
          throw new Error('HTTP ' + res.status + ' ' + stepInfo + msg + code);
        }
        window.arcadaShowAttachStatus('✅ PDF subido a Notion');
        return;
      }catch(e){
        console.error('arcadaAttachPdf attempt ' + attempt, e);
        if(attempt === MAX_ATTEMPTS){
          window.arcadaShowAttachStatus('⚠️ No se pudo subir a Notion tras ' + MAX_ATTEMPTS + ' intentos: ' + String(e.message || e).slice(0,260));
        }else{
          await new Promise(r=> setTimeout(r, 1500 * attempt)); // espera un poco más en cada reintento
        }
      }
    }
  };

  var _arcadaPendingPdf = null;
  window.arcadaShowAttachPrompt = function(base64, fileName){
    _arcadaPendingPdf = { base64: base64, fileName: fileName };
    var box = document.getElementById('arcadaAttachPrompt');
    if(!box){
      box = document.createElement('div');
      box.id = 'arcadaAttachPrompt';
      box.style.cssText = 'position:fixed;bottom:20px;right:20px;max-width:300px;background:#1d232b;border:1px solid #2a323b;border-radius:8px;padding:14px;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.4);font-family:inherit;';
      document.body.appendChild(box);
    }
    box.innerHTML =
      '<div style="font-size:13px;font-weight:600;color:#eef1f4;margin-bottom:8px;">¿Subir este PDF a Notion?</div>' +
      '<input type="text" id="arcadaAttachSearch" placeholder="Buscar cliente..." style="width:100%;padding:8px;border:1px solid #2a323b;border-radius:6px;background:#1d232b;color:#eef1f4;font-size:12px;margin-bottom:8px;box-sizing:border-box;font-family:inherit;">' +
      '<div id="arcadaAttachResults" style="max-height:150px;overflow-y:auto;margin-bottom:8px;"></div>' +
      '<button type="button" onclick="document.getElementById(\'arcadaAttachPrompt\').remove()" style="width:100%;padding:7px;border:1px solid #2a323b;border-radius:6px;background:transparent;color:#8b96a3;font-size:12px;cursor:pointer;font-family:inherit;">No, gracias</button>';
    box.style.display = 'block';
    document.getElementById('arcadaAttachSearch').addEventListener('input', arcadaAttachDebounce);
  };

  var _arcadaAttachTimer = null;
  function arcadaAttachDebounce(){
    clearTimeout(_arcadaAttachTimer);
    _arcadaAttachTimer = setTimeout(arcadaAttachSearchNow, 500);
  }
  async function arcadaAttachSearchNow(){
    var input = document.getElementById('arcadaAttachSearch');
    if(!input) return;
    var q = input.value.trim();
    var results = document.getElementById('arcadaAttachResults');
    if(q.length < 2){ results.innerHTML=''; return; }
    try{
      var res = await fetch('/.netlify/functions/search-leads?q=' + encodeURIComponent(q));
      var data = await res.json();
      var items = data.results || [];
      results.innerHTML = items.map(function(it, i){
        return '<div style="padding:7px 8px;font-size:12px;cursor:pointer;border-bottom:1px solid #2a323b;" onclick="arcadaPickAttachLead(' + i + ')">' +
          '<div style="font-weight:600;color:#eef1f4">' + (it.address || '') + '</div>' +
          '<div style="color:#8b96a3;font-size:11px">' + (it.client || '') + '</div></div>';
      }).join('');
      window._arcadaAttachResultsCache = items;
    }catch(e){ console.error(e); }
  }
  window.arcadaPickAttachLead = function(i){
    var it = window._arcadaAttachResultsCache[i];
    var box = document.getElementById('arcadaAttachPrompt');
    if(box) box.remove();
    if(_arcadaPendingPdf && it && it.id){
      window.arcadaAttachPdf(it.id, _arcadaPendingPdf.base64, _arcadaPendingPdf.fileName);
    }
  };

  window.arcadaOfferAttach = function(base64, fileName){
    var pageId = ((state.projects[state.currentId] && state.projects[state.currentId].notionPageId) || null);
    if(pageId){
      window.arcadaAttachPdf(pageId, base64, fileName);
    }else{
      window.arcadaShowAttachPrompt(base64, fileName);
    }
  };
})();
</script>
</body>
</html>
