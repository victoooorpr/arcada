<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arcada Gastos</title>
<style>
  :root {
    --bg: #f5f4f1;
    --card: #ffffff;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --line: #e2e0da;
    --accent: #c1502e;
    --accent-dark: #9c3f24;
    --ok: #2f7a4f;
    --err: #b3372c;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 {
    font-size: 20px;
    letter-spacing: 0.2px;
    margin: 4px 0 2px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }

  .field:last-child input, .field:last-child textarea { margin-bottom: 0; }

  .photo-box {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    text-align: center;
    padding: 20px 12px;
    margin-bottom: 14px;
    position: relative;
  }
  .photo-box.has-photo { border-style: solid; padding: 8px; }
  .photo-box img { max-width: 100%; max-height: 220px; border-radius: 6px; display: block; margin: 0 auto; }
  .photo-box p { margin: 0; color: var(--muted); font-size: 14px; }
  .photo-box input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .photo-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }

  button {
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:disabled { background: #cfc4bd; cursor: not-allowed; }
  .btn-primary:not(:disabled):active { background: var(--accent-dark); }
  .btn-secondary { background: #ece9e3; color: var(--ink); }
  .btn-link { background: none; color: var(--accent); padding: 6px 0; text-decoration: underline; }

  .status { font-size: 13px; margin-top: 8px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.loading { color: var(--muted); }

  .search-wrap { position: relative; margin-bottom: 8px; }
  .search-results {
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: #fff;
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 8px 8px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 6px 14px rgba(0,0,0,0.08);
  }
  .search-results div {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-size: 14px;
  }
  .search-results div:last-child { border-bottom: none; }
  .search-results div:hover, .search-results div:active { background: #f5f4f1; }

  .selected-project {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f5f4f1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 14px;
  }
  .selected-project button { background: none; color: var(--err); font-size: 13px; padding: 0; text-decoration: underline; }

  .unlinked-toggle { font-size: 13px; color: var(--muted); margin: -4px 0 14px; }
  .unlinked-toggle label { display: inline-flex; align-items: center; gap: 6px; text-transform: none; font-weight: 400; font-size: 13px; }
  .unlinked-toggle input { width: auto; margin: 0; }

  .submit-status { text-align: center; margin-top: 10px; font-size: 14px; }
</style>
</head>

    <div class="field">
      <label>Monto</label>
      <input type="number" step="0.01" id="monto" placeholder="0.00" />
    </div>
    <div class="field">
      <label>Tienda / Proveedor</label>
      <input type="text" id="tienda" placeholder="Ej. Home Depot" />
    </div>
    <div class="field">
      <label>Fecha de la compra</label>
      <input type="date" id="fecha" />
    </div>
    <div class="field">
      <label>Comprador</label>
      <input type="text" id="comprador" placeholder="Nombre completo o iniciales" />
    </div>
    <div class="field">
      <label>Nota (opcional)</label>
      <textarea id="nota" placeholder="Ej. Materiales para reparacion de emergencia"></textarea>
    </div>
  </div>

  <!-- 3. Proyecto / cliente -->
  <div class="card">
    <label>Proyecto / Cliente</label>

    <div id="searchArea">
      <div class="search-wrap">
        <input type="text" id="projectSearch" placeholder="Busca por nombre o direccion..." autocomplete="off" />
        <div class="search-results" id="searchResults" style="display:none;"></div>
      </div>
    </div>

    <div id="selectedProjectBox" class="selected-project" style="display:none;">
      <span id="selectedProjectName"></span>
      <button type="button" id="clearProjectBtn">Quitar</button>
    </div>

    <div class="unlinked-toggle">
      <label>
        <input type="checkbox" id="unlinkedCheckbox" />
        No vinculado a un proyecto todavia
      </label>
    </div>
  </div>

  <button class="btn-primary" id="submitBtn" type="button">Guardar gasto</button>
  <div class="submit-status" id="submitStatus"></div>
</div>

<script>
// ---------- Config ----------
// Ajusta estas rutas si tus funciones de Netlify usan otro path.
const EXTRACT_RECEIPT_URL = "/.netlify/functions/extract-receipt";
const SUBMIT_GASTO_URL = "/.netlify/functions/submit-gasto";
const SEARCH_LEADS_URL = "/.netlify/functions/search-leads";

let currentImageBase64 = null;
let currentMediaType = null;
let currentFilename = null;
let selectedProject = null; // { id, label }

// ---------- Foto ----------
const photoInput = document.getElementById("photoInput");
const photoBox = document.getElementById("photoBox");
const photoPreview = document.getElementById("photoPreview");
const photoPlaceholder = document.getElementById("photoPlaceholder");
const photoActions = document.getElementById("photoActions");
const analyzeBtn = document.getElementById("analyzeBtn");
const analyzeStatus = document.getElementById("analyzeStatus");
const retakeBtn = document.getElementById("retakeBtn");

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;
  currentMediaType = file.type || "image/jpeg";
  currentFilename = file.name || "recibo.jpg";

  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    currentImageBase64 = dataUrl.split(",")[1];
    photoPreview.src = dataUrl;
    photoPreview.style.display = "block";
    photoPlaceholder.style.display = "none";
    photoBox.classList.add("has-photo");
    photoActions.style.display = "flex";
    analyzeStatus.textContent = "";
  };
  reader.readAsDataURL(file);
});

retakeBtn.addEventListener("click", () => {
  photoInput.value = "";
  currentImageBase64 = null;
  photoPreview.style.display = "none";
  photoPlaceholder.style.display = "block";
  photoBox.classList.remove("has-photo");
  photoActions.style.display = "none";
  analyzeStatus.textContent = "";
});

analyzeBtn.addEventListener("click", async () => {
  if (!currentImageBase64) return;
  analyzeBtn.disabled = true;
  analyzeStatus.className = "status loading";
  analyzeStatus.textContent = "Leyendo el recibo...";

  try {
    const res = await fetch(EXTRACT_RECEIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageBase64: currentImageBase64, mediaType: currentMediaType }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "No se pudo leer el recibo");

    if (data.monto !== null && data.monto !== undefined) document.getElementById("monto").value = data.monto;
    if (data.tienda) document.getElementById("tienda").value = data.tienda;
    if (data.fecha) document.getElementById("fecha").value = data.fecha;

    analyzeStatus.className = "status ok";
    analyzeStatus.textContent = "Listo. Revisa los campos antes de guardar.";
  } catch (err) {
    analyzeStatus.className = "status err";
    analyzeStatus.textContent = "No se pudo leer el recibo automaticamente. Llena los campos a mano.";
  } finally {
    analyzeBtn.disabled = false;
  }
});

// ---------- Search bar de proyectos (Arcada LEADS) ----------
const projectSearch = document.getElementById("projectSearch");
const searchResults = document.getElementById("searchResults");
const selectedProjectBox = document.getElementById("selectedProjectBox");
const selectedProjectName = document.getElementById("selectedProjectName");
const clearProjectBtn = document.getElementById("clearProjectBtn");
const unlinkedCheckbox = document.getElementById("unlinkedCheckbox");
const searchArea = document.getElementById("searchArea");

let debounceTimer = null;

projectSearch.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  const q = projectSearch.value.trim();
  if (q.length < 2) {
    searchResults.style.display = "none";
    return;
  }
  debounceTimer = setTimeout(() => runSearch(q), 200);
});

async function runSearch(q) {
  try {
    const res = await fetch(`${SEARCH_LEADS_URL}?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const results = data.results || [];

    if (!Array.isArray(results) || results.length === 0) {
      searchResults.innerHTML = `<div style="color:#6b6b6b;">Sin resultados</div>`;
      searchResults.style.display = "block";
      return;
    }

    searchResults.innerHTML = "";
    results.forEach((item) => {
      const label = `${item.address || ""}${item.client ? " — " + item.client : ""}`;
      const div = document.createElement("div");
      div.textContent = label || "Proyecto sin nombre";
      div.addEventListener("click", () => selectProject(item, label));
      searchResults.appendChild(div);
    });
    searchResults.style.display = "block";
  } catch (err) {
    searchResults.innerHTML = `<div style="color:#b3372c;">Error buscando proyectos</div>`;
    searchResults.style.display = "block";
  }
}

function selectProject(item, label) {
  selectedProject = { id: item.id, label };
  selectedProjectName.textContent = label;
  selectedProjectBox.style.display = "flex";
  searchArea.style.display = "none";
  searchResults.style.display = "none";
  projectSearch.value = "";
}

clearProjectBtn.addEventListener("click", () => {
  selectedProject = null;
  selectedProjectBox.style.display = "none";
  searchArea.style.display = "block";
});

unlinkedCheckbox.addEventListener("change", () => {
  if (unlinkedCheckbox.checked) {
    searchArea.style.display = "none";
    selectedProjectBox.style.display = "none";
    selectedProject = null;
    projectSearch.value = "";
  } else {
    searchArea.style.display = "block";
  }
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap")) searchResults.style.display = "none";
});

// ---------- Guardar gasto ----------
const submitBtn = document.getElementById("submitBtn");
const submitStatus = document.getElementById("submitStatus");

submitBtn.addEventListener("click", async () => {
  const monto = document.getElementById("monto").value;
  const tienda = document.getElementById("tienda").value.trim();
  const fecha = document.getElementById("fecha").value;
  const comprador = document.getElementById("comprador").value;
  const nota = document.getElementById("nota").value.trim();

  if (!currentImageBase64) {
    submitStatus.className = "submit-status status err";
    submitStatus.textContent = "Falta la foto del recibo.";
    return;
  }
  if (!comprador) {
    submitStatus.className = "submit-status status err";
    submitStatus.textContent = "Escribe quien hizo la compra.";
    return;
  }
  if (!selectedProject && !unlinkedCheckbox.checked) {
    submitStatus.className = "submit-status status err";
    submitStatus.textContent = "Vincula un proyecto o marca 'No vinculado todavia'.";
    return;
  }

  submitBtn.disabled = true;
  submitStatus.className = "submit-status status loading";
  submitStatus.textContent = "Guardando...";

  try {
    const res = await fetch(SUBMIT_GASTO_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        monto: monto || null,
        tienda: tienda || null,
        fecha: fecha || null,
        comprador,
        nota: nota || null,
        proyectoPageId: selectedProject ? selectedProject.id : null,
        imageBase64: currentImageBase64,
        mediaType: currentMediaType,
        filename: currentFilename,
      }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Error al guardar");

    submitStatus.className = "submit-status status ok";
    submitStatus.textContent = "Gasto guardado correctamente.";

    setTimeout(() => window.location.reload(), 1500);
  } catch (err) {
    submitStatus.className = "submit-status status err";
    submitStatus.textContent = "No se pudo guardar. Intenta de nuevo.";
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
